<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صنعة يد</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- الخط العربي -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #F8FAFC;
        }
    </style>
    
    <!-- إعداد الألوان -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#C2410C',
                        secondary: '#1E293B',
                    }
                }
            }
        }
    </script>
</head>
<body class="text-secondary antialiased mx-auto bg-slate-50 min-h-screen shadow-sm max-w-md relative pb-10">

    <!-- 1. الشريط العلوي (Header) -->
    <header class="flex justify-between items-center p-4 mt-2">
        <div class="w-8"></div>

        <!-- الشعار -->
        <div class="text-center flex flex-col items-center">
            <h1 class="text-3xl font-bold flex items-center gap-2">
                صنعة 
                <span class="text-primary border-2 border-primary rounded-lg px-2 py-0.5 flex items-center justify-center text-xl">ص</span> 
                يد
            </h1>
            <p class="text-[11px] text-gray-500 mt-0.5">الدليل الأول للحرفيين في ليبيا</p>
        </div>

        <!-- زر القائمة -->
        <button class="text-2xl text-gray-800">
            <i class="fas fa-bars"></i>
        </button>
    </header>

    <!-- 2. الشعار اللفظي -->
    <div class="text-center py-1 mb-3">
        <p class="text-primary font-medium text-xs flex justify-center items-center gap-2">
            <i class="fas fa-fan text-[9px]"></i>
            صنعة في اليد ولا ورث الجد
            <i class="fas fa-fan text-[9px]"></i>
        </p>
    </div>

    <!-- 3. قسم البحث (Search Card) -->
    <section class="px-4 mb-6">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            
            <div class="grid grid-cols-2 gap-2 mb-3">
                <!-- اختر المدينة -->
                <div class="relative bg-gray-50 rounded-xl p-2 border border-gray-200 flex items-center gap-2">
                    <div class="text-gray-400 text-lg px-1">
                        <i class="fas fa-location-dot"></i>
                    </div>
                    <div class="flex-1">
                        <label class="block text-[10px] text-gray-400">المنطقة</label>
                        <select id="citySelect" class="w-full bg-transparent text-xs font-bold text-gray-700 outline-none appearance-none cursor-pointer">
                            <option value="">اختر المنطقة</option>
                        </select>
                    </div>
                    <i class="fas fa-chevron-down text-gray-400 text-xs pl-1"></i>
                </div>

                <!-- اختر المهنة -->
                <div class="relative bg-gray-50 rounded-xl p-2 border border-gray-200 flex items-center gap-2">
                    <div class="text-gray-400 text-lg px-1">
                        <i class="fas fa-wrench"></i>
                    </div>
                    <div class="flex-1">
                        <label class="block text-[10px] text-gray-400">الصنعة</label>
                        <select id="professionSelect" class="w-full bg-transparent text-xs font-bold text-gray-700 outline-none appearance-none cursor-pointer">
                            <option value="">اختر الصنعة</option>
                        </select>
                    </div>
                    <i class="fas fa-chevron-down text-gray-400 text-xs pl-1"></i>
                </div>
            </div>

            <!-- زر البحث -->
            <button id="searchBtn" class="w-full bg-primary hover:bg-orange-800 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-sm text-sm transition-colors">
                <i class="fas fa-search"></i>
                <span>ابحث</span>
            </button>

        </div>
    </section>

    <!-- 4. قسم نخبة الحرفيين (Featured Artisans) -->
    <section class="px-4">
        
        <!-- عنوان القسم -->
        <div class="flex items-center justify-center gap-2 mb-4">
            <span class="text-xl">🏅</span>
            <h2 class="text-lg font-bold text-gray-900">نخبة الحرفيين في ليبيا</h2>
            <span class="text-xl">🏅</span>
        </div>

        <!-- حاوية القائمة (سيتم ملؤها برمجياً من Supabase لاحقاً) -->
        <div id="artisansList" class="space-y-3">
            
            <!-- بطاقة تجريبية (مكان العرض) -->
            <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex items-center justify-between">
                
                <!-- الأزرار التفاعلية (يمين باللغة العربية) -->
                <div class="flex items-center gap-1.5">
                    <!-- اتصال -->
                    <a href="tel:0910000000" class="flex flex-col items-center justify-center w-11 h-11 bg-blue-50 text-blue-500 rounded-xl">
                        <i class="fas fa-phone text-xs"></i>
                        <span class="text-[9px] mt-0.5 font-medium">اتصال</span>
                    </a>
                    <!-- واتساب -->
                    <a href="https://wa.me/218910000000" class="flex flex-col items-center justify-center w-11 h-11 bg-emerald-50 text-emerald-500 rounded-xl">
                        <i class="fab fa-whatsapp text-sm"></i>
                        <span class="text-[9px] mt-0.5 font-medium">واتساب</span>
                    </a>
                    <!-- مفضلة -->
                    <button class="flex flex-col items-center justify-center w-11 h-11 bg-gray-50 text-gray-400 rounded-xl">
                        <i class="far fa-heart text-xs"></i>
                        <span class="text-[9px] mt-0.5 font-medium">مفضلة</span>
                    </button>
                    <!-- تقييم -->
                    <button class="flex flex-col items-center justify-center w-11 h-11 bg-gray-50 text-gray-400 rounded-xl">
                        <i class="far fa-star text-xs"></i>
                        <span class="text-[9px] mt-0.5 font-medium">تقييم</span>
                    </button>
                </div>

                <!-- تفاصيل الحرفي والأيقونة (يسار) -->
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <div class="flex items-center justify-end gap-1">
                            <span class="text-xs text-orange-500">✔</span>
                            <h3 class="font-bold text-sm text-gray-800">أحمد السنوسي</h3>
                        </div>
                        <p class="text-xs text-gray-500 mt-0.5">سباك صحي</p>
                        <div class="flex items-center justify-end gap-2 mt-1 text-[11px] text-gray-400">
                            <span class="flex items-center gap-0.5 text-amber-500 font-bold">
                                4.9 <i class="fas fa-star text-[9px]"></i>
                            </span>
                            <span>•</span>
                            <span class="flex items-center gap-0.5">
                                <i class="fas fa-location-dot text-[9px]"></i> طرابلس
                            </span>
                        </div>
                    </div>

                    <!-- أيقونة المهنة -->
                    <div class="w-12 h-12 bg-orange-50 text-primary rounded-xl flex items-center justify-center text-xl">
                        <i class="fas fa-faucet text-primary"></i>
                    </div>
                </div>

            </div>

        </div>

    </section>

</body>
</html>
