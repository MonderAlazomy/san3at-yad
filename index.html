<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صنعة يد | دليلك الأول للحرفيين في ليبيا</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    :root {
      --burnt-orange: #d94b10;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent-light: #fff5f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 40px; }

    .top-header { background: var(--card-bg); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
    .brand-logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 42px; height: 42px; background: var(--burnt-orange); color: white; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.4rem; }
    .brand-text h1 { font-size: 1.3rem; color: var(--text-main); font-weight: 800; }
    .brand-text p { font-size: 0.75rem; color: var(--text-muted); }
    .btn-login { border: 1px solid var(--border-color); background: white; color: var(--burnt-orange); padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 0.9rem; }

    .container { max-width: 600px; margin: 0 auto; padding: 0 15px; }
    .slogan-container { text-align: center; margin: 20px 0 15px; color: var(--burnt-orange); font-weight: 700; }
    
    .filter-card { background: var(--card-bg); padding: 18px; border-radius: 18px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; }
    .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .select-box { background: #f8fafc; border: 1px solid var(--border-color); border-radius: 12px; padding: 8px 12px; display: flex; align-items: center; gap: 8px; }
    .select-box i { color: var(--burnt-orange); }
    .select-wrapper { width: 100%; }
    .select-wrapper label { display: block; font-size: 0.7rem; color: var(--text-muted); }
    select { width: 100%; border: none; background: transparent; font-size: 0.9rem; font-weight: 700; outline: none; }
    .btn-search { background: var(--burnt-orange); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-size: 1.05rem; font-weight: 700; cursor: pointer; }

    .section-title { text-align: center; margin: 25px 0 15px; }
    .section-title h2 { font-size: 1.15rem; font-weight: 800; }
    .section-title span { color: var(--text-muted); font-size: 0.85rem; }

    .artisans-list { display: flex; flex-direction: column; gap: 12px; }
    
    #debugConsole {
      background: #1e1e1e;
      color: #00ff66;
      padding: 12px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 0.75rem;
      margin-bottom: 15px;
      display: block;
      white-space: pre-wrap;
      word-break: break-all;
      direction: ltr;
      text-align: left;
    }
  </style>
</head>
<body>

  <div class="top-header">
    <button class="btn-login"><i class="fa-solid fa-arrow-right-to-bracket"></i> دخول</button>
    <div class="brand-logo">
      <div class="brand-text">
        <h1>صنعة يد</h1>
        <p>دليلك الأول للحرفيين في ليبيا</p>
      </div>
      <div class="logo-icon">ص</div>
    </div>
  </div>

  <div class="container">
    <div class="slogan-container">✨ صنعة في اليد ولا ورث الجد ✨</div>

    <div id="debugConsole">=== LOG START ===\n</div>

    <div class="filter-card">
      <div class="filter-grid">
        <div class="select-box">
          <i class="fa-solid fa-wrench"></i>
          <div class="select-wrapper">
            <label>الصنعة / المهنة</label>
            <select id="professionSelect"><option value="">اختر المهنة</option></select>
          </div>
        </div>

        <div class="select-box">
          <i class="fa-solid fa-location-dot"></i>
          <div class="select-wrapper">
            <label>المدينة / المنطقة</label>
            <select id="citySelect"><option value="">اختر المدينة</option></select>
          </div>
        </div>
      </div>

      <button class="btn-search"><i class="fa-solid fa-magnifying-glass"></i> بحث</button>
    </div>

    <div class="section-title">
      <h2>🏆 نخبة الحرفيين في ليبيا 🏆</h2>
      <span>الأعلى تقييماً والأكثر توازناً من العملاء</span>
    </div>

    <div id="artisansList" class="artisans-list">
      <div style="text-align:center; padding:20px; color:#64748b;">جاري جلب البيانات...</div>
    </div>
  </div>

  <script>
    function logMessage(msg, obj = null) {
      const debugConsole = document.getElementById('debugConsole');
      let text = `[LOG] ${msg}\n`;
      if (obj) {
        text += JSON.stringify(obj, null, 2) + '\n';
      }
      console.log(msg, obj || '');
      debugConsole.innerText += text;
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const SUPABASE_URL = 'https://bdnwsimnfhdguunicajh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJkbndzaW1uZmhkZ3V1bmljYWpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3MjU3OTgsImV4cCI6MjA5ODMwMTc5OH0.p4hTjuZOVeH7MelD5HQ6u4EL2EK6aubzh1BpK7xYN3E'; 

        logMessage('1. Starting Supabase Client creation...');
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        logMessage('1. After Supabase Client created successfully.');

        // 2. جلب المدن
        logMessage('2. Fetching cities...');
        const citiesRes = await supabaseClient.from('cities').select('*');
        logMessage('2. After fetching cities. citiesRes:', citiesRes);

        // 3. جلب المهن
        logMessage('3. Fetching professions...');
        const professionsRes = await supabaseClient.from('professions').select('*');
        logMessage('3. After fetching professions. professionsRes:', professionsRes);

        // 4. جلب الحرفيين
        logMessage('4. Fetching artisans...');
        const artisansRes = await supabaseClient.from('artisans').select('*');
        logMessage('4. After fetching artisans. artisansRes:', artisansRes);

        logMessage('=== ALL FETCHES COMPLETED ===');

      } catch (err) {
        logMessage('EXCEPTIONAL ERROR CAUGHT:', {
          message: err.message,
          stack: err.stack,
          raw: err
        });
      }
    });
  </script>
</body>
</html>
