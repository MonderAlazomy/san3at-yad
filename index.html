<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صنعة يد</title>
    
    <!-- جلب Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- جلب أيقونات FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- جلب خط تجوال لدعم العربية بشكل جميل -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #F8FAFC;
        }
    </style>
    
    <!-- إعداد ألوان المشروع -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#C2410C',
                        secondary: '#1E293B',
                    }
                }
            }
        }
    </script>
</head>
<body class="text-secondary antialiased mx-auto bg-white min-h-screen shadow-sm max-w-md relative pb-10">

    <!-- 1. الشريط العلوي (Header) -->
    <header class="flex justify-between items-center p-4 mt-2">
        <div class="w-8"></div>

        <!-- الشعار -->
        <div class="text-center flex flex-col items-center">
            <h1 class="text-3xl font-bold flex items-center gap-2">
                صنعة 
                <span class="text-primary border-2 border-primary rounded-lg px-2 py-1 flex items-center justify-center text-xl">ص</span> 
                يد
            </h1>
            <p class="text-[11px] text-gray-500 mt-1">الدليل الأول للحرفيين في ليبيا</p>
        </div>

        <!-- زر القائمة -->
        <button class="text-2xl text-gray-800">
            <i class="fas fa-bars"></i>
        </button>
    </header>

    <!-- 2. الشعار اللفظي -->
    <div class="text-center py-2 mb-4">
        <p class="text-primary font-medium text-sm flex justify-center items-center gap-2">
            <i class="fas fa-fan text-[10px]"></i>
            صنعة في اليد ولا ورث الجد
            <i class="fas fa-fan text-[10px]"></i>
        </p>
    </div>

</body>
</html>
