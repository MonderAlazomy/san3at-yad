<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صنعة يد</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- الخط العربي -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #F8FAFC;
        }
    </style>
    
    <!-- إعداد الألوان -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#C2410C',
                        secondary: '#1E293B',
                    }
                }
            }
        }
    </script>
</head>
<body class="text-secondary antialiased mx-auto bg-slate-50 min-h-screen shadow-sm max-w-md relative pb-10">

    <!-- 1. الشريط العلوي (Header) -->
    <header class="flex justify-between items-center p-4 mt-2">
        <div class="w-8"></div>

        <!-- الشعار -->
        <div class="text-center flex flex-col items-center">
            <h1 class="text-3xl font-bold flex items-center gap-2">
                صنعة 
                <span class="text-primary border-2 border-primary rounded-lg px-2 py-0.5 flex items-center justify-center text-xl">ص</span> 
                يد
            </h1>
            <p class="text-[11px] text-gray-500 mt-0.5">الدليل الأول للحرفيين في ليبيا</p>
        </div>

        <!-- زر القائمة -->
        <button class="text-2xl text-gray-800">
            <i class="fas fa-bars"></i>
        </button>
    </header>

    <!-- 2. الشعار اللفظي -->
    <div class="text-center py-1 mb-3">
        <p class="text-primary font-medium text-xs flex justify-center items-center gap-2">
            <i class="fas fa-fan text-[9px]"></i>
            صنعة في اليد ولا ورث الجد
            <i class="fas fa-fan text-[9px]"></i>
        </p>
    </div>

    <!-- 3. قسم البحث (Search Card) -->
    <section class="px-4 mb-6">
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            
            <div class="grid grid-cols-2 gap-2 mb-3">
                <!-- اختر المدينة -->
                <div class="relative bg-gray-50 rounded-xl p-2 border border-gray-200 flex items-center gap-2">
                    <div class="text-gray-400 text-lg px-1">
                        <i class="fas fa-location-dot"></i>
                    </div>
                    <div class="flex-1">
                        <label class="block text-[10px] text-gray-400">المنطقة</label>
                        <select id="citySelect" class="w-full bg-transparent text-xs font-bold text-gray-700 outline-none appearance-none cursor-pointer">
                            <option value="">اختر المنطقة</option>
                        </select>
                    </div>
                    <i class="fas fa-chevron-down text-gray-400 text-xs pl-1"></i>
                </div>

                <!-- اختر المهنة -->
                <div class="relative bg-gray-50 rounded-xl p-2 border border-gray-200 flex items-center gap-2">
                    <div class="text-gray-400 text-lg px-1">
                        <i class="fas fa-wrench"></i>
                    </div>
                    <div class="flex-1">
                        <label class="block text-[10px] text-gray-400">الصنعة</label>
                        <select id="professionSelect" class="w-full bg-transparent text-xs font-bold text-gray-700 outline-none appearance-none cursor-pointer">
                            <option value="">اختر الصنعة</option>
                        </select>
                    </div>
                    <i class="fas fa-chevron-down text-gray-400 text-xs pl-1"></i>
                </div>
            </div>

            <!-- زر البحث -->
            <button id="searchBtn" class="w-full bg-primary hover:bg-orange-800 text-white font-bold py-3 rounded-xl flex items-center justify-center gap-2 shadow-sm text-sm transition-colors">
                <i class="fas fa-search"></i>
                <span>ابحث</span>
            </button>

        </div>
    </section>

    <!-- 4. قسم نخبة الحرفيين (Featured Artisans) -->
    <section class="px-4">
        
        <!-- عنوان القسم -->
        <div class="flex items-center justify-center gap-2 mb-4">
            <span class="text-xl">🏅</span>
            <h2 class="text-lg font-bold text-gray-900">نخبة الحرفيين في ليبيا</h2>
            <span class="text-xl">🏅</span>
        </div>

        <!-- حاوية القائمة -->
        <div id="artisansList" class="space-y-3">
            <div class="text-center py-6 text-gray-400 text-xs">جاري تحميل الحرفيين...</div>
        </div>

    </section>

    <!-- كود الربط والتشغيل (JavaScript) -->
    <script>
        const SUPABASE_URL = 'https://bdnwsimnfhdguunicajh.supabase.co';
        const SUPABASE_ANON_KEY = 'Sb_publishable_GF1OJ8QV-vyqgUaCzOZbVQ_JbZI9ObR';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // جلب البيانات عند تحميل الصفحة
        document.addEventListener('DOMContentLoaded', async () => {
            await loadCities();
            await loadProfessions();
            await fetchArtisans();
        });

        // جلب المدن
        async function loadCities() {
            const { data } = await _supabase.from('cities').select('name_ar');
            const select = document.getElementById('citySelect');
            if (data) {
                data.forEach(c => {
                    select.innerHTML += `<option value="${c.name_ar}">${c.name_ar}</option>`;
                });
            }
        }

        // جلب المهن
        async function loadProfessions() {
            const { data } = await _supabase.from('professions').select('name_ar');
            const select = document.getElementById('professionSelect');
            if (data) {
                data.forEach(p => {
                    select.innerHTML += `<option value="${p.name_ar}">${p.name_ar}</option>`;
                });
            }
        }

        // جلب الحرفيين مع الفلترة
        async function fetchArtisans(selectedRegion = '', selectedProfession = '') {
            const container = document.getElementById('artisansList');
            container.innerHTML = '<div class="text-center py-6 text-gray-400 text-xs">جاري البحث...</div>';

            let query = _supabase.from('artisans').select('*');

            if (selectedRegion) query = query.eq('region', selectedRegion);
            if (selectedProfession) query = query.eq('profession', selectedProfession);

            const { data, error } = await query;

            if (error || !data || data.length === 0) {
                container.innerHTML = '<div class="text-center py-6 text-gray-400 text-xs">لا يوجد حرفيين مطابقين حالياً</div>';
                return;
            }

            container.innerHTML = '';
            data.forEach(a => {
                const city = a.region || 'غير محدد';
                const profession = a.profession || 'حرفي';
                const name = a.full_name || 'حرفي';
                const phone = a.phone_number || '';
                
                container.innerHTML += `
                    <div class="bg-white rounded-2xl p-3 shadow-sm border border-gray-100 flex items-center justify-between">
                        <div class="flex items-center gap-1.5">
                            <a href="tel:${phone}" class="flex flex-col items-center justify-center w-11 h-11 bg-blue-50 text-blue-500 rounded-xl">
                                <i class="fas fa-phone text-xs"></i>
                                <span class="text-[9px] mt-0.5 font-medium">اتصال</span>
                            </a>
                            <a href="https://wa.me/${phone}" class="flex flex-col items-center justify-center w-11 h-11 bg-emerald-50 text-emerald-500 rounded-xl">
                                <i class="fab fa-whatsapp text-sm"></i>
                                <span class="text-[9px] mt-0.5 font-medium">واتساب</span>
                            </a>
                            <button class="flex flex-col items-center justify-center w-11 h-11 bg-gray-50 text-gray-400 rounded-xl">
                                <i class="far fa-heart text-xs"></i>
                                <span class="text-[9px] mt-0.5 font-medium">مفضلة</span>
                            </button>
                            <button class="flex flex-col items-center justify-center w-11 h-11 bg-gray-50 text-gray-400 rounded-xl">
                                <i class="far fa-star text-xs"></i>
                                <span class="text-[9px] mt-0.5 font-medium">تقييم</span>
                            </button>
                        </div>

                        <div class="flex items-center gap-3">
                            <div class="text-right">
                                <div class="flex items-center justify-end gap-1">
                                    <span class="text-xs text-orange-500">✔</span>
                                    <h3 class="font-bold text-sm text-gray-800">${name}</h3>
                                </div>
                                <p class="text-xs text-gray-500 mt-0.5">${profession}</p>
                                <div class="flex items-center justify-end gap-2 mt-1 text-[11px] text-gray-400">
                                    <span class="flex items-center gap-0.5 text-amber-500 font-bold">
                                        ${a.rating || '5.0'} <i class="fas fa-star text-[9px]"></i>
                                    </span>
                                    <span>•</span>
                                    <span class="flex items-center gap-0.5">
                                        <i class="fas fa-location-dot text-[9px]"></i> ${city}
                                    </span>
                                </div>
                            </div>

                            <div class="w-12 h-12 bg-orange-50 text-primary rounded-xl flex items-center justify-center text-xl">
                                <i class="fas fa-wrench text-primary"></i>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // زر البحث
        document.getElementById('searchBtn').addEventListener('click', () => {
            const region = document.getElementById('citySelect').value;
            const profession = document.getElementById('professionSelect').value;
            fetchArtisans(region, profession);
        });
    </script>

</body>
</html>
